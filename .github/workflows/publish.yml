name: Publish Beszel APK feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even when upstream version is unchanged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beszel-apk-feed
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch upstream APKs
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      version: ${{ steps.fetch.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install owfeed
        uses: owfeed/owfeed/setup@be4da6ddbb2f78353f7e5ba291533ae5463de22c # v0.5.6

      - name: Check upstream release and fetch APKs
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: bash scripts/fetch-upstream.sh

      - name: Validate feed configuration
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          owfeed lock --update
          owfeed build

      - name: Upload fetched packages
        if: steps.fetch.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beszel-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test signed feed on OpenWrt 25.12
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install owfeed
        uses: owfeed/owfeed/setup@be4da6ddbb2f78353f7e5ba291533ae5463de22c # v0.5.6

      - name: Download fetched packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beszel-dist
          path: dist/

      - name: Create a temporary signing key
        run: |
          set -euo pipefail
          owfeed keygen -o "$RUNNER_TEMP/owfeed-test.pem"
          while IFS= read -r line; do
            [[ -n "$line" ]] && echo "::add-mask::$line"
          done < "$RUNNER_TEMP/owfeed-test.pem"
          {
            echo "OWFEED_SIGN_KEY<<OWFEED_TEST_KEY_EOF"
            cat "$RUNNER_TEMP/owfeed-test.pem"
            echo "OWFEED_TEST_KEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Sign and index with temporary key
        run: |
          set -euo pipefail
          owfeed lock --update
          owfeed build
          owfeed sign
          owfeed index
          bash scripts/check-feed.sh dist out
          owfeed doctor --require-origin
          owfeed smoke --release 25.12 --arch aarch64_cortex-a53
          owfeed smoke --release 25.12 --arch mipsel_24kc

  publish:
    name: Sign and publish feed
    needs: [fetch, test]
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install owfeed
        uses: owfeed/owfeed/setup@be4da6ddbb2f78353f7e5ba291533ae5463de22c # v0.5.6

      - name: Download fetched packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beszel-dist
          path: dist/

      - name: Sign, index and validate
        env:
          OWFEED_SIGN_KEY: ${{ secrets.OWFEED_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OWFEED_SIGN_KEY" ]]; then
            echo "Missing repository secret OWFEED_SIGN_KEY." >&2
            exit 1
          fi
          owfeed lock --update
          owfeed build
          owfeed sign
          owfeed index
          bash scripts/check-feed.sh dist out
          owfeed doctor --require-origin
          owfeed publish

      - name: Add release metadata and landing page
        run: |
          set -euo pipefail
          cp dist/UPSTREAM_VERSION out/UPSTREAM_VERSION
          version="$(sed 's/^v//' out/UPSTREAM_VERSION)"
          sed "s/VERSION_PLACEHOLDER/$version/g" site/index.html > out/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify published feed
        env:
          FEED_URL: https://blackf1re.github.io/openwrt-repo
          EXPECTED_VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            live_version="$(curl -fsSL "$FEED_URL/UPSTREAM_VERSION" 2>/dev/null || true)"
            [[ "$live_version" == "$EXPECTED_VERSION" ]] && break
            if [[ "$attempt" -eq 12 ]]; then
              echo "GitHub Pages did not expose the expected version $EXPECTED_VERSION." >&2
              exit 1
            fi
            sleep 10
          done
          owfeed verify --release 25.12 --arch aarch64_cortex-a53
          owfeed verify --release 25.12 --arch mipsel_24kc
